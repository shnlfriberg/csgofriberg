name: CI and Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.13.1
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm test:version
      - run: pnpm test
        env:
          DB_CLIENT: sqlite
          DB_URL: /tmp/friberg-verification/ci.sqlite3
          LOCATION_ASSET_DIR: /tmp/friberg-ci-assets
          # Same isolated-prefix convention as scripts/test-integrated.ps1; Redis
          # integration suites refuse any other prefix.
          REDIS_PREFIX: 'integration-tests:ci-${{ github.run_id }}-${{ github.run_attempt }}:'
          NODE_ENV: test
      - run: pnpm build

  docker:
    needs: test
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - id: build_info
        name: Validate release and generate build identity
        run: node scripts/build-info.cjs ci
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.version=${{ steps.build_info.outputs.version }}
            org.opencontainers.image.revision=${{ steps.build_info.outputs.revision }}
            org.opencontainers.image.created=${{ steps.build_info.outputs.created }}
          tags: |
            type=raw,value=latest,enable=${{ steps.build_info.outputs.stable }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: friberg-candidate:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_SOURCE=https://github.com/${{ github.repository }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.build_info.outputs.version }}
            OCI_CREATED=${{ steps.build_info.outputs.created }}
            RELEASE_TAG=${{ steps.build_info.outputs.release_tag }}
            RESOURCE_VERSION=${{ steps.build_info.outputs.resource_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - name: Publish verified build inputs with attestations
        id: publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_SOURCE=https://github.com/${{ github.repository }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.build_info.outputs.version }}
            OCI_CREATED=${{ steps.build_info.outputs.created }}
            RELEASE_TAG=${{ steps.build_info.outputs.release_tag }}
            RESOURCE_VERSION=${{ steps.build_info.outputs.resource_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Record published version
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.build_info.outputs.version }}
          REVISION: ${{ steps.build_info.outputs.revision }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "Version: $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Git: $REVISION" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ghcr.io/${GITHUB_REPOSITORY}@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
